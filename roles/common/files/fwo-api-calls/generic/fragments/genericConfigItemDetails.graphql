fragment genericConfigItemDetails on generic_config_item {
  id
  mgm_id
  item_uid
  item_name
  item_order
  config_line
  owner_id
  last_used
  first_seen
  created
  removed
  management {
    mgm_id
    mgm_name
    dev_typ_id
  }
  owner {
    id
    name
    app_id_external
    recert_interval
  }
}
